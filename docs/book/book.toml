[book]
title = "athena: Iterative Solvers for Atlas"
authors = ["Ryan Clanton"]
src = "."
language = "en"
[build]
build-dir = "../../target/book/athena"
create-missing = false

# `mdbook test` compiles fenced `rust` blocks as doctests; the edition must
# match the workspace so book samples parse exactly as the crates do.
[rust]
edition = "2024"
[output.html]
no-section-label = false
mathjax-support = true
site-url = "/athena/"
git-repository-url = "https://github.com/ryancinsight/athena"
default-theme = "rust"