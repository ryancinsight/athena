name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@da9d549bc50dbb9c4e1d18dca8f37d17059098cb
    with:
      package: athena-core,athena-hephaestus,athena-leto,athena-krylov
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      - name: Install headless Vulkan adapter
        run: sudo apt-get update && sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Feature checks
        run: |
          cargo check --workspace --all-targets --all-features
          cargo check --workspace --no-default-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Native tests
        env:
          CI: "true"
          XDG_RUNTIME_DIR: /tmp
        run: cargo nextest run --workspace --all-features
      - name: Documentation tests
        run: cargo test --doc --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      - name: Examples
        run: |
          cargo run -p athena-krylov --example poisson_cpu --features cpu
          cargo run -p athena-krylov --example nonsymmetric_cpu --features cpu
          cargo run -p athena-krylov --example poisson_accelerator --no-default-features --features accelerator
          cargo run -p athena-krylov --example nonsymmetric_accelerator --no-default-features --features accelerator

  # The strict zero-traffic contract is #[ignore]d in the default suite because
  # it flakes on some hosted Linux runners; skipping it there made the gate
  # vacuous. This job runs the contract and its bounded-traffic classifier
  # explicitly: the classifier fails only when traffic scales with solve count
  # or memory is retained, so an environment-fixed burst reports green while a
  # real solve-path allocation fails closed.
  allocation-instrument:
    name: Allocation instrument
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pin glibc to a single arena so per-thread tcache churn cannot
      # produce allocation traffic the solver does not cause. If the
      # strict zero-traffic contract passes under this pin, it names
      # glibc arena churn as the environment noise and clears the way
      # for unconditionally re-enabling the strict test.
      MALLOC_ARENA_MAX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      - name: Run allocation contracts with ignored tests enabled
        run: cargo nextest run -p athena-leto --test allocation --run-ignored ignored-only

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
