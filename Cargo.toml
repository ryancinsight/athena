[workspace]
resolver = "3"
members = [
    "crates/athena",
    "crates/athena-core",
    "crates/athena-hephaestus",
    "crates/athena-leto",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/athena"
# The workspace is published to crates.io; individual crates opt out with
# their own `publish = false` if they are ever build-only.
publish = true

[workspace.dependencies]
athena-core = { path = "crates/athena-core", version = "0.1.1" }
athena-hephaestus = { path = "crates/athena-hephaestus", version = "0.1.1" }
athena-leto = { path = "crates/athena-leto", version = "0.1.1" }
mnemosyne = { package = "mnemosyne-memory", version = "0.7.0", git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "062dda8", features = ["eunomia"] }
mnemosyne-arena = { version = "0.4.0", git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "062dda8", features = ["eunomia"] }

eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
leto = { version = "0.43.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std"] }
leto-ops = { version = "0.43.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std"] }
hephaestus-core = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", default-features = false }
hephaestus-wgpu = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", default-features = false, features = ["sparse"] }
bytemuck = { version = "1.25", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Single source of truth for the lint floor. Members inherit with
# `[lints] workspace = true`; a member re-declaring a level forks this table.
# `priority = -1` would let individual entries below override the group -- there
# are none: a full `cargo clippy --workspace --all-targets --all-features`
# census measured 0 pedantic hits (0 in production), so no class is allowed and
# every pedantic lint is a hard error. Any new hit must be fixed, never added
# here as an allow.
pedantic = { level = "deny", priority = -1 }

# --- Restriction floor ---
# Zero production `unwrap` sites (and zero in tests): denied outright with no
# ratchet, so a panicking unwrap cannot enter any target.
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
codegen-units = 1
debug = false
lto = "thin"
overflow-checks = true
strip = "symbols"






