[package]
# Registry name only. The crates.io name `athena` belongs to an unrelated
# third-party crate, so this publishes as `athena-krylov` while `[lib] name`
# keeps the import path `athena` — the same split the stack uses for
# `moirai-runtime`, `mnemosyne-memory`, `themis-topology`, `iris-viz`, and
# `gaia-mesh`. Consumers write
# `athena = { package = "athena-krylov", version = "0.1.0" }` and every
# `use athena::…` is unchanged.
name = "athena-krylov"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "CPU and GPU iterative linear solvers for Atlas"

[lib]
# Import path stays `athena` regardless of the registry name above.
name = "athena"
path = "src/lib.rs"

[features]
default = ["cpu"]
cpu = ["dep:athena-leto"]
accelerator = ["dep:athena-hephaestus"]

[dependencies]
athena-core.workspace = true
athena-leto = { workspace = true, optional = true }
athena-hephaestus = { workspace = true, optional = true }

[dev-dependencies]
eunomia.workspace = true
hephaestus-core.workspace = true
hephaestus-wgpu.workspace = true
leto.workspace = true
leto-ops.workspace = true

[[example]]
name = "poisson_cpu"
required-features = ["cpu"]

[[example]]
name = "poisson_accelerator"
required-features = ["accelerator"]

[[example]]
name = "nonsymmetric_cpu"
required-features = ["cpu"]

[[example]]
name = "nonsymmetric_accelerator"
required-features = ["accelerator"]

[lints]
workspace = true
